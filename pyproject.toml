description = "A repo for estimating the parameters of the Galactic Binaries using MCMC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "corner>=2.3.0",
    "h5py>=3.16.0",
    "gbgpu>=1.2.4",
    "lisaanalysistools==1.2.7",
]
